# Render blueprint -- API, database and cache.
#
#   Render Dashboard -> New -> Blueprint -> pick this repo.
#
# The Next.js frontend is NOT defined here: it is deployed on Vercel, whose root
# directory is set to `frontend/`. That split is why CORS_ORIGINS is `sync: false`
# below rather than a service reference -- Render cannot resolve a Vercel
# hostname, so it is set by hand in the dashboard once the Vercel URL exists.
#
# Everything is on the free tier so a cohort can be stood up without a card.
# Free Postgres is deleted 30 days after creation and free web services sleep
# after 15 minutes idle.

databases:
  - name: survivors-db
    databaseName: survivors
    user: survivors
    plan: free

services:
  # ---------------------------------------------------------------------------
  # FastAPI -- owns the dataset, the scoring and every piece of ground truth.
  # ---------------------------------------------------------------------------
  - type: web
    name: survivors-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Boot builds the default cohort dataset and runs the validation gate, so
    # give the health check room; $PORT is assigned by Render.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
    healthCheckPath: /api/v1/meta/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      # One worker fits the free instance's 512 MB alongside the generated
      # dataset. Raise this only after moving to a paid plan.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: DATABASE_URL
        fromDatabase:
          name: survivors-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: survivors-cache
          property: connectionString
      - key: CACHE_TTL_SECONDS
        value: "3600"
      # Set this in the Render dashboard to your Vercel domain once the frontend
      # is deployed, e.g. `simu.vercel.app`. A bare hostname is fine -- config.py
      # prefixes https://. Comma-separate to allow preview deployments too.
      # Until it is set, the browser will block every API call with a CORS error.
      - key: CORS_ORIGINS
        sync: false
      - key: INR_RATE
        value: "83"
      - key: DELIBERATION_SECONDS
        value: "15"
      # Give every teaching cohort its own seed -- reusing one across semesters
      # means the reveal is common knowledge before the second intake.
      - key: DEFAULT_COHORT_SEED
        value: "20260729"

  # ---------------------------------------------------------------------------
  # Cache. Values are all derived from the cohort seed and immutable for its
  # lifetime; without this the API falls back to a per-process dict, which is
  # correct for one worker and wrong for several.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: survivors-cache
    plan: free
    ipAllowList: []  # private network only
    maxmemoryPolicy: allkeys-lru
